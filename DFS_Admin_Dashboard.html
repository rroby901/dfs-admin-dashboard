const CLIENT_ID = "078588e5-1121-49cd-9f92-428a78165fbf";

};

const msalConfig = {
  auth: {
    clientId: CLIENT_ID,
    authority: `https://login.microsoftonline.com/${TENANT_ID}`,
    redirectUri: window.location.href.split("?")[0],
  },
  cache: { cacheLocation: "sessionStorage" }
};

const scopes = ["https://graph.microsoft.com/Sites.ReadWrite.All"];

let msalInstance = null;
let accessToken = null;

const getMsal = () => {
  if (!msalInstance) {
    msalInstance = new msal.PublicClientApplication(msalConfig);
  }
  return msalInstance;
};

const getToken = async () => {
  if (accessToken) return accessToken;
  const app = getMsal();
  await app.initialize();
  const accounts = app.getAllAccounts();
  if (accounts.length > 0) {
    try {
      const result = await app.acquireTokenSilent({ scopes, account: accounts[0] });
      accessToken = result.accessToken;
      return accessToken;
    } catch (e) {}
  }
  const result = await app.acquireTokenPopup({ scopes });
  accessToken = result.accessToken;
  return accessToken;
};

const graphFetch = async (url, options = {}) => {
  const token = await getToken();
  const res = await fetch(`https://graph.microsoft.com/v1.0${url}`, {
    headers: {
      "Authorization": `Bearer ${token}`,
      "Content-Type": "application/json",
      ...options.headers,
    },
    ...options,
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(`Graph API error: ${res.status} ${err}`);
  }
  if (res.status === 204) return null;
  return res.json();
};

// Get SharePoint site ID for Graph API calls
let spSiteId = null;
const getSiteId = async () => {
  if (spSiteId) return spSiteId;
  const data = await graphFetch(`/sites/delatorgroup.sharepoint.com:/sites/DelatorGroup`);
  spSiteId = data.id;
  return spSiteId;
};

const spFetch = async (listIdOrName, query = "") => {
  const siteId = await getSiteId();
  // Try by GUID first, then by name
  let listId = listIdOrName;
  if (!listIdOrName.includes("-")) {
    // It's a name, look it up
    const lists = await graphFetch(`/sites/${siteId}/lists`);
    const found = lists.value.find(l => l.name === listIdOrName || l.displayName === listIdOrName);
    if (!found) throw new Error(`List not found: ${listIdOrName}`);
    listId = found.id;
  }
  const data = await graphFetch(`/sites/${siteId}/lists/${listId}/items?expand=fields${query ? "&" + query : ""}`);
  return data?.value?.map(item => ({ ID: item.id, ...item.fields })) ?? [];
};

const spPatch = async (listGuid, itemId, updates) => {
  const siteId = await getSiteId();
  // Remove metadata field
  const { "__metadata": _, ...fields } = updates;
  // Convert SharePoint internal names to Graph field names
  const graphFields = {};
  for (const [key, val] of Object.entries(fields)) {
    graphFields[key] = val;
  }
  await graphFetch(`/sites/${siteId}/lists/${listGuid}/items/${itemId}/fields`, {
    method: "PATCH",
    body: JSON.stringify(graphFields),
  });
};

const spPost = async (listGuid, data) => {
  const siteId = await getSiteId();
  const { "__metadata": _, ...fields } = data;
  const result = await graphFetch(`/sites/${siteId}/lists/${listGuid}/items`, {
    method: "POST",
    body: JSON.stringify({ fields }),
  });
  return result?.fields;
};

// ── Main App ─────────────────────────────────────────────────────────────
function App() {
  const [jobs, setJobs] = useState([]);
  const [clients, setClients] = useState([]);
  const [servers, setServers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [search, setSearch] = useState("");
  const [toast, setToast] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [saving, setSaving] = useState(false);
  const [intakeState, setIntakeState] = useState({});

  const notify = (msg, type = "success") => setToast({ message: msg, type });

  // ── Load data from SharePoint ──────────────────────────────────────────
  const loadJobs = useCallback(async () => {
    try {
      // Fetch all active jobs and filter in JS - Graph API doesn't support SP internal field filters
      const data = await spFetch(LISTS.DFS_JOBS, "$top=500");
      const allJobs = data || [];
      // Filter to only pending review jobs
      const pendingJobs = allJobs.filter(j => {
        const status = j.Operational_x0020_Status?.Value ?? j.Operational_x0020_Status ?? j.Operational_x002 ?? "";
        return status === "New Request" || status === "Pending Admin Review";
      });
      const sorted = pendingJobs.sort((a, b) =>
        (SL_ORDER[a.Service_x0020_Level?.Value ?? a.Service_x0020_Level] ?? 9) -
        (SL_ORDER[b.Service_x0020_Level?.Value ?? b.Service_x0020_Level] ?? 9)
      );
      setJobs(sorted);
      if (sorted.length > 0 && !selectedId) setSelectedId(sorted[0].ID);
    } catch (e) {
      setLoadError(e.message);
    }
  }, []);

  const loadClients = useCallback(async () => {
    try {
      const data = await spFetch(LISTS.CLIENTS, "$top=200");
      setClients((data || []).map(c => ({ ID: c.ID, Account_x0020_Name: c.Account_x0020_Name || c.AccountName || c.Title })));
    } catch (e) {
      console.warn("Could not load clients:", e.message);
    }
  }, []);

  const loadServers = useCallback(async () => {
    try {
      const data = await spFetch(LISTS.SERVERS, "$top=100");
      setServers((data || []).map(s => s.Name || s.name || s.Title).filter(Boolean));
    } catch (e) {
      console.warn("Could not load servers:", e.message);
      setServers(["Paris", "Johnson", "Williams", "Davis", "Martinez"]);
    }
  }, []);

  useEffect(() => {
    Promise.all([loadJobs(), loadClients(), loadServers()])
      .finally(() => setLoading(false));
  }, []);

  const getIS = () => intakeState[selectedId] || {};
  const setIS = updates => setIntakeState(p => ({ ...p, [selectedId]: { ...p[selectedId], ...updates } }));
  const is = getIS();

  const job = jobs.find(j => j.ID === selectedId);
  const jobSL = job?.Service_x0020_Level?.Value ?? job?.Service_x0020_Level ?? "Routine";
  const jobStatus = job?.Operational_x0020_Status?.Value ?? job?.Operational_x0020_Status ?? "";

  const filteredJobs = jobs.filter(j => {
    if (!search) return true;
    const sl = j.Service_x0020_Level?.Value ?? j.Service_x0020_Level ?? "";
    const raw = j.Client_x0020_Account_x0020_Raw ?? "";
    const person = j.Person_x0020_Entity_x0020_to_x00 ?? "";
    const county = j.County ?? "";
    const title = j.Title ?? "";
    const q = search.toLowerCase();
    return title.toLowerCase().includes(q) || raw.toLowerCase().includes(q) ||
           person.toLowerCase().includes(q) || county.toLowerCase().includes(q);
  });

  // ── Actions ──────────────────────────────────────────────────────────
  const handleApprove = () => {
    if (!is.serverAssigned) { notify("Assign a server before approving", "warning"); return; }
    if (is.existingClient === undefined) { notify("Confirm client status before approving", "warning"); return; }
    setConfirm({
      label: `Approve Job ${job.Title}`,
      message: `This will set Operational Status to Approved, triggering FLOW-02: Job ID assignment, folder creation, packet documents, and client confirmation email.`,
      type: "success", confirmLabel: "Approve & Trigger Flow",
      onConfirm: async () => {
        setSaving(true);
        setConfirm(null);
        try {
          const updates = {
            "Operational_x0020_Status": "Approved",
            "Server_x0020_Assigned": is.serverAssigned || "",
          };
          if (is.court !== undefined) updates["Court"] = is.court;
          if (is.docketCaseNumber !== undefined) updates["Docket_x0020_Case_x0020_Number"] = is.docketCaseNumber;
          if (is.county) updates["County"] = is.county;
          if (is.alternateAddress !== undefined) updates["Alternate_x0020_Address"] = is.alternateAddress;
          // Set Client Account lookup using Graph API format
          if (is.existingClient && is.selectedClient) {
            const matchedClient = clients.find(c =>
              (c.Account_x0020_Name || "").toLowerCase() === is.selectedClient.toLowerCase()
            );
            if (matchedClient) {
              // Graph API lookup fields use display name + "LookupId" 
              updates["Client_x0020_AccountLookupId"] = parseInt(matchedClient.ID);
            }
          }
          await spPatch(LISTS.DFS_JOBS, job.ID, updates);
          setJobs(p => p.filter(j => j.ID !== selectedId));
          const remaining = jobs.filter(j => j.ID !== selectedId);
          setSelectedId(remaining.length > 0 ? remaining[0].ID : null);
          notify(`Job ${job.Title} approved — FLOW-02 triggered`, "success");
        } catch (e) {
          notify(`Error: ${e.message}`, "error");
        } finally {
          setSaving(false);
        }
      }
    });
  };

  const handleReturn = () => {
    setConfirm({
      label: `Return Job ${job.Title} to Client`,
      message: `The job will move to Awaiting Client Correction. Add a note explaining what needs to be fixed.`,
      type: "warning", showReason: true, reasonLabel: "What needs to be corrected?",
      confirmLabel: "Return to Client",
      onConfirm: async (reason) => {
        setSaving(true);
        setConfirm(null);
        try {
          await spPatch(LISTS.DFS_JOBS, job.ID, {
            "Operational_x0020_Status": "Awaiting Client Correction",
          });
          setJobs(p => p.filter(j => j.ID !== selectedId));
          const remaining = jobs.filter(j => j.ID !== selectedId);
          setSelectedId(remaining.length > 0 ? remaining[0].ID : null);
          notify(`Job ${job.Title} returned to client`, "warning");
        } catch (e) {
          notify(`Error: ${e.message}`, "error");
        } finally {
          setSaving(false);
        }
      }
    });
  };

  const handleCancel = () => {
    setConfirm({
      label: `Cancel Job ${job.Title}`,
      message: `The job will be marked Canceled Before Attempt and removed from the queue. This cannot be undone.`,
      type: "error", showReason: true, reasonLabel: "Reason for cancellation",
      confirmLabel: "Cancel Job",
      onConfirm: async (reason) => {
        setSaving(true);
        setConfirm(null);
        try {
          await spPatch(LISTS.DFS_JOBS, job.ID, {
            "Operational_x0020_Status": "Canceled Before Attempt",
          });
          setJobs(p => p.filter(j => j.ID !== selectedId));
          const remaining = jobs.filter(j => j.ID !== selectedId);
          setSelectedId(remaining.length > 0 ? remaining[0].ID : null);
          notify(`Job ${job.Title} canceled`, "error");
        } catch (e) {
          notify(`Error: ${e.message}`, "error");
        } finally {
          setSaving(false);
        }
      }
    });
  };

  const handleCreateClient = async (formData) => {
    try {
      const newClient = await spPost(LISTS.CLIENTS, {
        "Title": formData.accountName,
        "Account_x0020_Name": formData.accountName,
        "Primary_x0020_Contact": formData.contactName,
        "Billing_x0020_Email": formData.email,
        "Notes": formData.phone ? `Phone: ${formData.phone}` : "",
      });
      await loadClients();
      setIS({ showNewClientForm: false, existingClient: true,
        selectedClient: formData.accountName, newClientCreated: true });
      notify(`Client "${formData.accountName}" created`, "success");
    } catch (e) {
      notify(`Error creating client: ${e.message}`, "error");
    }
  };

  // ── Render ────────────────────────────────────────────────────────────
  if (loading) return <Spinner />;

  if (loadError) return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center",
      height: "100vh", flexDirection: "column", gap: 16, padding: 32 }}>
      <div style={{ fontSize: 32 }}>⚠️</div>
      <div style={{ fontWeight: 700, fontSize: 16, color: C.navy }}>Could not connect to SharePoint</div>
      <div style={{ fontSize: 13, color: C.gray600, maxWidth: 400, textAlign: "center" }}>
        {loadError}. Make sure you are logged into your Delator Group SharePoint account in this browser.
      </div>
      <button onClick={() => { setLoading(true); setLoadError(null); loadJobs().finally(() => setLoading(false)); }}
        style={{ background: C.navy, color: C.white, border: "none", borderRadius: 6,
          padding: "10px 20px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
        Retry
      </button>
    </div>
  );

  return (
    <div style={{ fontFamily: "'Inter','Segoe UI',Arial,sans-serif", background: C.offwhite,
      minHeight: "100vh", display: "flex", flexDirection: "column" }}>

      {/* ── HEADER ── */}
      <div style={{ background: C.navy, borderBottom: `3px solid ${C.steel}`,
        padding: "0 20px", display: "flex", alignItems: "center", height: 52, gap: 14, flexShrink: 0 }}>
        <img src="https://rroby901.github.io/dfs-admin-dashboard/DFS_Logo_Mark.png"
          width={34} height={34} alt="DFS"
          style={{objectFit:"contain",flexShrink:0}} />
        <div>
          <div style={{ color: C.white, fontWeight: 700, fontSize: 14, lineHeight: 1 }}>
            Delator Field Services
          </div>
          <div style={{ color: C.silver, fontSize: 10, letterSpacing: "1.5px", textTransform: "uppercase" }}>
            Admin Intake Dashboard
          </div>
        </div>
        <div style={{ flex: 1 }} />
        <div style={{ background: C.navyDark, border: `1px solid ${C.navyLight}`,
          borderRadius: 20, padding: "4px 14px", display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ color: C.gray400, fontSize: 12 }}>⌕</span>
          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder="Search jobs, clients, counties..."
            style={{ background: "none", border: "none", outline: "none",
              color: C.white, fontSize: 12, width: 220 }} />
        </div>
        <button onClick={() => { setLoading(true); loadJobs().finally(() => setLoading(false)); }}
          title="Refresh queue"
          style={{ background: C.navyLight, border: "none", borderRadius: 6,
            padding: "5px 10px", color: C.white, cursor: "pointer", fontSize: 14 }}>
          ↻
        </button>
        <div style={{
          background: filteredJobs.some(j => (j.Service_x0020_Level?.Value ?? j.Service_x0020_Level) === "Same Day Rush")
            ? C.red : C.navyLight,
          color: C.white, borderRadius: 12, padding: "3px 12px", fontSize: 11, fontWeight: 700 }}>
          {filteredJobs.length} pending
        </div>
      </div>

      {/* ── BODY ── */}
      <div style={{ display: "flex", flex: 1, overflow: "hidden", height: "calc(100vh - 52px)" }}>

        {/* ── LEFT: Job Queue ── */}
        <div style={{ width: 290, background: C.white, borderRight: `1px solid ${C.gray200}`,
          display: "flex", flexDirection: "column", overflow: "hidden", flexShrink: 0 }}>
          <div style={{ padding: "10px 14px", borderBottom: `1px solid ${C.gray200}` }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: C.navy,
              textTransform: "uppercase", letterSpacing: "1px" }}>Pending Review</div>
            <div style={{ fontSize: 11, color: C.gray400, marginTop: 1 }}>Sorted by urgency</div>
          </div>
          <div style={{ overflowY: "auto", flex: 1 }}>
            {filteredJobs.length === 0 && (
              <div style={{ padding: 32, textAlign: "center", color: C.gray400, fontSize: 13 }}>
                {jobs.length === 0 ? "No jobs pending review" : "No matching jobs"}
              </div>
            )}
            {filteredJobs.map(j => {
              const sel = j.ID === selectedId;
              const sl = j.Service_x0020_Level?.Value ?? j.Service_x0020_Level ?? "Routine";
              const status = j.Operational_x0020_Status?.Value ?? j.Operational_x0020_Status ?? "";
              return (
                <div key={j.ID} onClick={() => setSelectedId(j.ID)}
                  style={{ padding: "11px 14px", cursor: "pointer",
                    borderBottom: `1px solid ${C.gray100}`,
                    borderLeft: sel ? `3px solid ${C.steel}` : "3px solid transparent",
                    background: sel ? "#EBF2FB" : "transparent", transition: "background 0.1s" }}>
                  <div style={{ display: "flex", alignItems: "center",
                    justifyContent: "space-between", marginBottom: 4 }}>
                    <span style={{ fontWeight: 700, fontSize: 13, color: C.navy,
                      fontFamily: "monospace" }}>{j.Title || "—"}</span>
                    <Badge level={sl} />
                  </div>
                  <div style={{ fontSize: 12, color: C.gray600, marginBottom: 3,
                    overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {j.Client_x0020_Account_x0020_Raw || "No client name"}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <span style={{ width: 7, height: 7, borderRadius: "50%",
                      background: status === "New Request" ? C.steelLight : C.silver,
                      display: "inline-block", flexShrink: 0 }} />
                    <span style={{ fontSize: 11, color: C.gray400, flex: 1 }}>{status}</span>
                    {!j.Documents_x0020_Uploaded && (
                      <span style={{ fontSize: 10, color: C.red, fontWeight: 700 }}>⚠ NO DOCS</span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* ── RIGHT: Intake Form ── */}
        {!job ? (
          <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center",
            color: C.gray400, fontSize: 14 }}>
            {jobs.length === 0 ? "Queue is empty — no jobs pending review" : "Select a job to review"}
          </div>
        ) : (
          <div style={{ flex: 1, overflowY: "auto", padding: 24 }}>

            {/* Job header bar */}
            <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 20,
              background: C.white, border: `1px solid ${C.gray200}`, borderRadius: 8, padding: "12px 16px" }}>
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontFamily: "monospace", fontSize: 20, fontWeight: 900, color: C.navy }}>
                    {job.Title || "Pending ID"}
                  </span>
                  <Badge level={jobSL} />
                  <span style={{ fontSize: 11, color: C.gray400 }}>
                    {new Date(job.Created).toLocaleString("en-US",
                      { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}
                  </span>
                </div>
                <div style={{ fontSize: 12, color: C.gray600, marginTop: 3 }}>{jobStatus}</div>
              </div>
              <div style={{ flex: 1 }} />
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 10, color: C.gray400, textTransform: "uppercase",
                  letterSpacing: "0.8px", marginBottom: 2 }}>First Attempt Deadline</div>
                <div style={{ fontSize: 14, fontWeight: 700,
                  color: jobSL === "Same Day Rush" ? C.red : C.navy }}>
                  {SL_CFG[jobSL]?.deadline || "+7 days"} from approval
                </div>
              </div>
            </div>

            {/* ── 1. CLIENT VERIFICATION ── */}
            <SectionBar>1. Client Verification</SectionBar>
            <div style={{ background: C.white, border: `1px solid ${C.gray200}`,
              borderRadius: 6, padding: 14, marginBottom: 6 }}>
              <div style={{ marginBottom: 12 }}>
                <SLabel>As Submitted by Client</SLabel>
                <span style={{ fontSize: 13, fontWeight: 600, color: C.navy }}>
                  {job.Client_x0020_Account_x0020_Raw || "—"}
                </span>
              </div>
              <div style={{ marginBottom: 12 }}>
                <SLabel>Existing Client?</SLabel>
                <div style={{ display: "flex", gap: 8 }}>
                  {["Yes", "No"].map(v => (
                    <button key={v}
                      onClick={() => setIS({ existingClient: v === "Yes", showNewClientForm: v === "No", selectedClient: "" })}
                      style={{ padding: "6px 20px", borderRadius: 6, fontSize: 13, fontWeight: 600,
                        cursor: "pointer",
                        border: `1.5px solid ${is.existingClient === (v === "Yes") ? C.steel : C.gray300}`,
                        background: is.existingClient === (v === "Yes") ? C.steelXLight : C.white,
                        color: is.existingClient === (v === "Yes") ? C.navy : C.gray600 }}>
                      {v}
                    </button>
                  ))}
                </div>
              </div>

              {is.existingClient === true && (
                <div>
                  <SLabel>Match to Client Account</SLabel>
                  <select value={is.selectedClient || ""}
                    onChange={e => setIS({ selectedClient: e.target.value })}
                    style={{ width: "100%", maxWidth: 400, border: `1px solid ${C.steelLight}`,
                      borderRadius: 4, padding: "6px 8px", fontSize: 13, outline: "none" }}>
                    <option value="">— Select existing client —</option>
                    {clients.map(c => (
                      <option key={c.ID} value={c.Account_x0020_Name}>{c.Account_x0020_Name}</option>
                    ))}
                  </select>
                  {is.selectedClient && (
                    <div style={{ marginTop: 8, fontSize: 12, color: C.green, fontWeight: 600 }}>
                      ✓ Matched: {is.selectedClient}
                      {is.selectedClient.toLowerCase() === (job.Client_x0020_Account_x0020_Raw || "").toLowerCase()
                        ? " — exact match" : " — verify spelling with client record"}
                    </div>
                  )}
                </div>
              )}

              {is.showNewClientForm && (
                <NewClientForm
                  prefill={job.Client_x0020_Account_x0020_Raw}
                  onSave={handleCreateClient}
                  onCancel={() => setIS({ showNewClientForm: false, existingClient: undefined })}
                />
              )}
              {is.newClientCreated && (
                <div style={{ fontSize: 12, color: C.green, fontWeight: 600, marginTop: 4 }}>
                  ✓ New client record created and matched
                </div>
              )}
            </div>

            <Divider />

            {/* ── 2. DOCUMENTS ── */}
            <SectionBar>2. Documents</SectionBar>
            <div style={{ background: job.Documents_x0020_Uploaded ? C.greenLight : C.redLight,
              border: `1px solid ${job.Documents_x0020_Uploaded ? C.green : C.red}`,
              borderRadius: 6, padding: "10px 14px", marginBottom: 6,
              display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 18 }}>{job.Documents_x0020_Uploaded ? "✅" : "⚠️"}</span>
              <span style={{ fontSize: 13, fontWeight: 600,
                color: job.Documents_x0020_Uploaded ? C.green : C.red }}>
                {job.Documents_x0020_Uploaded
                  ? "Client confirmed document upload — verify files in SharePoint file request folder"
                  : "No document upload confirmed — do not approve until documents are received"}
              </span>
            </div>
            <div style={{ marginBottom: 16 }}>
              <CheckItem label="Documents located in file request folder"
                checked={is.docsLocated || false} onChange={v => setIS({ docsLocated: v })} />
              <CheckItem label="Correct number of copies confirmed"
                checked={is.docsCopiesOk || false} onChange={v => setIS({ docsCopiesOk: v })} />
            </div>

            <Divider />

            {/* ── 3. TARGET INFORMATION ── */}
            <SectionBar>3. Target Information</SectionBar>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr",
              gap: "12px 24px", marginBottom: 8 }}>
              <ROField label="Person / Entity to Be Served"
                value={job.Person_x0020_Entity_x0020_to_x00} highlight wide />
              <ROField label="Primary Service Address"
                value={job.Service_x0020_Address} highlight wide />
              <div>
                <SLabel>County</SLabel>
                <select value={is.county || job.County || ""}
                  onChange={e => setIS({ county: e.target.value })}
                  style={{ width: "100%", border: `1px solid ${C.steelLight}`, borderRadius: 4,
                    padding: "6px 8px", fontSize: 13, outline: "none" }}>
                  <option value="">— Select county —</option>
                  {TN_COUNTIES.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div>
                <SLabel>Address Type</SLabel>
                <div style={{ display: "flex", gap: 16, paddingTop: 4 }}>
                  {["Residential", "Commercial"].map(t => (
                    <label key={t} style={{ display: "flex", alignItems: "center",
                      gap: 5, fontSize: 13, cursor: "pointer" }}>
                      <input type="radio" name={`addrType_${job.ID}`} value={t}
                        checked={(is.addressType || "Residential") === t}
                        onChange={() => setIS({ addressType: t, commercialType: "" })}
                        style={{ accentColor: C.navy }} />
                      {t}
                    </label>
                  ))}
                </div>
                {is.addressType === "Commercial" && (
                  <select value={is.commercialType || ""}
                    onChange={e => setIS({ commercialType: e.target.value })}
                    style={{ marginTop: 8, width: "100%", border: `1px solid ${C.steelLight}`,
                      borderRadius: 4, padding: "6px 8px", fontSize: 13, outline: "none" }}>
                    <option value="">— Building type —</option>
                    {COMMERCIAL_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                )}
              </div>
              <EditField label="Alternate Address"
                value={is.alternateAddress ?? (job.Alternate_x0020_Address || "")}
                onChange={v => setIS({ alternateAddress: v })} wide />
              <EditField label="Subject Phone (if known)"
                value={is.subjectPhone || ""}
                onChange={v => setIS({ subjectPhone: v })} />
              <EditField label="Safety Concerns"
                value={is.safetyConcerns || ""}
                onChange={v => setIS({ safetyConcerns: v })}
                placeholder="Any known safety issues at this address..." />
              <EditField label="Court (from uploaded documents)"
                value={is.court ?? (job.Court || "")}
                onChange={v => setIS({ court: v })}
                placeholder="Pull from summons / subpoena" />
              <EditField label="Case / Docket Number"
                value={is.docketCaseNumber ?? (job.Docket_x0020_Case_x0020_Number || "")}
                onChange={v => setIS({ docketCaseNumber: v })}
                placeholder="Pull from summons / subpoena" />
            </div>

            {job.Special_x0020_Instructions && (
              <div style={{ background: C.amberLight, border: `1px solid ${C.amberBorder}`,
                borderRadius: 6, padding: "10px 14px", marginBottom: 8,
                fontSize: 13, color: C.gray800, lineHeight: 1.6 }}>
                <strong style={{ color: C.amber }}>Special Instructions: </strong>
                {job.Special_x0020_Instructions}
              </div>
            )}

            <Divider />

            {/* ── 4. SERVICE FLAGS ── */}
            <SectionBar>4. Service Flags</SectionBar>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr",
              gap: "0 24px", marginBottom: 8 }}>
              <div>
                <CheckItem label="Evasive Subject"
                  checked={is.evadingService || false} onChange={v => setIS({ evadingService: v })} />
                <CheckItem label="Stakeout Authorized"
                  checked={is.stakeoutAuth || false} onChange={v => setIS({ stakeoutAuth: v })} />
              </div>
              <div>
                <CheckItem label="Drop Service Allowed"
                  checked={is.dropAllowed || false} onChange={v => setIS({ dropAllowed: v })} />
                <CheckItem label="Sub-Service Allowed"
                  checked={is.subAllowed || false} onChange={v => setIS({ subAllowed: v })} />
              </div>
            </div>

            <Divider />

            {/* ── 5. RETURN FLAGS ── */}
            <SectionBar>5. Return Flags</SectionBar>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr",
              gap: "0 24px", marginBottom: 8 }}>
              <CheckItem label="Original Return Required"
                checked={is.originalReturn || false} onChange={v => setIS({ originalReturn: v })} />
              <CheckItem label="Service Affidavit Required"
                checked={is.affidavitReq || false} onChange={v => setIS({ affidavitReq: v })} />
              <CheckItem label="Notarization Required"
                checked={is.notarizationReq || false} onChange={v => setIS({ notarizationReq: v })} />
            </div>

            <Divider />

            {/* ── 6. STOP & ESCALATE ── */}
            <SectionBar color={C.red}>6. Stop &amp; Escalate — Contact Randall Immediately</SectionBar>
            <div style={{ background: C.redLight, border: `1px solid ${C.redBorder}`,
              borderRadius: 6, padding: "8px 14px", marginBottom: 8 }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 24px" }}>
                {[
                  ["hostileSub",    "Hostile / Threatening Subject"],
                  ["mediaInq",      "Media Inquiry"],
                  ["lawEnf",        "Law Enforcement Involvement"],
                  ["emergServ",     "Emergency Service Requested"],
                  ["judgeInstr",    "Judge-Specific Instructions"],
                  ["serverAssault", "Server Assault"],
                  ["paymentDisp",   "Payment Dispute / Billing Issue"],
                  ["procChallenge", "Process Challenge"],
                ].map(([k, label]) => (
                  <CheckItem key={k} label={label} danger
                    checked={is[k] || false} onChange={v => setIS({ [k]: v })} />
                ))}
              </div>
            </div>

            <Divider />

            {/* ── 7. SERVER ASSIGNMENT ── */}
            <SectionBar>7. Server Assignment</SectionBar>
            <div style={{ marginBottom: 8 }}>
              <SLabel>Assign Server</SLabel>
              <select value={is.serverAssigned || ""}
                onChange={e => setIS({ serverAssigned: e.target.value })}
                style={{ width: 280, border: `1px solid ${C.steelLight}`, borderRadius: 4,
                  padding: "7px 10px", fontSize: 13, outline: "none" }}>
                <option value="">— Select server —</option>
                {servers.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>

            <Divider />

            {/* ── 8. OPERATIONS PREP ── */}
            <SectionBar>8. Operations Prep Checklist</SectionBar>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr",
              gap: "0 24px", marginBottom: 8 }}>
              {[
                ["opJobId",           "Job ID Assigned"],
                ["opIndexCard",       "Index Card Completed"],
                ["opListPop",         "Jobs List Populated"],
                ["opFolderBuilt",     "Folder Structure Built"],
                ["opPacketPrinted",   "Packet Printed"],
                ["opPacketAssembled", "Packet Assembled"],
                ["opEnvLabeled",      "Envelope Labeled"],
                ["opServerNotified",  "Server Notified"],
                ["opBilled",          "Job Billed"],
              ].map(([k, label]) => (
                <CheckItem key={k} label={label}
                  checked={is[k] || false} onChange={v => setIS({ [k]: v })} />
              ))}
            </div>

            <Divider />

            {/* ── 9. PREPARED BY ── */}
            <SectionBar>9. Prepared By</SectionBar>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr",
              gap: "12px 24px", marginBottom: 24 }}>
              <div>
                <SLabel>Prepared By</SLabel>
                <select value={is.preparedBy || ""}
                  onChange={e => setIS({ preparedBy: e.target.value })}
                  style={{ width: "100%", border: `1px solid ${C.steelLight}`, borderRadius: 4,
                    padding: "7px 10px", fontSize: 13, outline: "none" }}>
                  <option value="">— Select —</option>
                  {STAFF.map(n => <option key={n} value={n}>{n}</option>)}
                </select>
              </div>
              <div>
                <SLabel>Date Prepared</SLabel>
                <input type="date"
                  value={is.datePrepared || new Date().toISOString().split("T")[0]}
                  onChange={e => setIS({ datePrepared: e.target.value })}
                  style={{ border: `1px solid ${C.steelLight}`, borderRadius: 4,
                    padding: "7px 10px", fontSize: 13, outline: "none" }} />
              </div>
            </div>

            {/* ── ACTION BUTTONS ── */}
            <div style={{ display: "flex", gap: 12, paddingBottom: 32,
              borderTop: `2px solid ${C.gray200}`, paddingTop: 20 }}>
              <button onClick={handleApprove} disabled={saving}
                style={{ background: saving ? C.gray400 : C.green, color: C.white,
                  border: "none", borderRadius: 7, padding: "11px 28px",
                  fontSize: 14, fontWeight: 700, cursor: saving ? "not-allowed" : "pointer",
                  boxShadow: "0 2px 8px rgba(25,111,61,0.3)" }}>
                {saving ? "Saving..." : "✓ Approve Job"}
              </button>
              <button onClick={handleReturn} disabled={saving}
                style={{ background: C.amberLight, color: C.amber,
                  border: `1.5px solid ${C.amberBorder}`, borderRadius: 7,
                  padding: "11px 22px", fontSize: 14, fontWeight: 700,
                  cursor: saving ? "not-allowed" : "pointer" }}>
                ↩ Return to Client
              </button>
              <button onClick={handleCancel} disabled={saving}
                style={{ background: C.redLight, color: C.red,
                  border: `1.5px solid ${C.redBorder}`, borderRadius: 7,
                  padding: "11px 22px", fontSize: 14, fontWeight: 700,
                  cursor: saving ? "not-allowed" : "pointer" }}>
                ✕ Cancel Job
              </button>
            </div>

          </div>
        )}
      </div>

      {confirm && <ConfirmDialog action={confirm} onCancel={() => setConfirm(null)} />}
      {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
